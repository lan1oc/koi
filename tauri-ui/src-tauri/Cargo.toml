[package]
name = "koi-tauri"
version = "4.0.0"
description = "koi Tauri desktop UI"
authors = ["lan1oc"]
edition = "2021"

[lib]
name = "koi_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["backup", "bundled"] }
chrono = "0.4"
regex = "1"
calamine = "0.25"
csv = "1.4"
rust_xlsxwriter = "0.76"
strsim = "0.11"
encoding_rs = "0.8"
quick-xml = "0.39.3"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
url = "2.5"
lopdf = { version = "0.44", default-features = false }
zip = { version = "1.1.4", default-features = false, features = ["deflate"] }

[[test]]
name = "backend_core"
path = "src/backend/mod.rs"

[[test]]
name = "document_conversion_isolated"
path = "src/backend/document_conversion_isolated.rs"

[target.'cfg(windows)'.dependencies]
libloading = "0.8.9"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }
