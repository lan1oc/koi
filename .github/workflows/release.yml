name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content tauri-ui/src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Version not found in tauri-ui/src-tauri/Cargo.toml"
          }
          $version = $matches[1]
          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v\d+\.\d+\.\d+') {
            $version = $ref.Substring(1)
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install UI dependencies
        working-directory: tauri-ui
        run: npm ci

      - name: Build Tauri flat release
        working-directory: tauri-ui
        run: npm run release:flat

      - name: Archive release
        shell: pwsh
        run: |
          Compress-Archive -Path dist-tauri/koi/* -DestinationPath dist-tauri/wow-v${{ steps.version.outputs.version }}-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-v${{ steps.version.outputs.version }}-windows
          path: dist-tauri/wow-v${{ steps.version.outputs.version }}-windows.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-tauri/wow-v${{ steps.version.outputs.version }}-windows.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
