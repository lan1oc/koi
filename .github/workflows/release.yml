name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller koi.spec
      - name: Archive dist (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath dist/wow-${{ github.ref_name }}-windows.zip
      - name: Upload build artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-windows
          path: dist/wow-${{ github.ref_name }}-windows.zip
      - name: Publish Release (Windows)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-windows.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (x64 via manylinux_2_28 using SYSTEM Python 3.11)
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            -e GITHUB_REF_NAME=${{ github.ref_name }} \
            -v "${{ github.workspace }}:/src" -w /src \
            quay.io/pypa/manylinux_2_28_x86_64 bash -c '
              # 1. 安装基础依赖和系统级 Python 3.11
              yum install -y zip mesa-libGL libxkbcommon libxcb libX11 python3.11 python3.11-devel python3.11-pip && \
              
              # 2. 显式使用 /usr/bin/python3.11 确保使用动态链接版本
              /usr/bin/python3.11 -m pip install --upgrade pip && \
              
              # 3. 安装项目依赖
              /usr/bin/python3.11 -m pip install PySide6==6.7.2 shiboken6==6.7.2 && \
              /usr/bin/python3.11 -m pip install -r requirements.txt && \
              /usr/bin/python3.11 -m pip install pyinstaller && \
              
              # 4. 编译 (使用绝对路径)
              /usr/bin/python3.11 -m PyInstaller koi.spec && \
              
              # 5. 打包
              zip -r dist/wow-${GITHUB_REF_NAME}-linux-x64.zip dist/*
            '
      - name: Upload build artifact (Linux x64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-linux-x64
          path: dist/wow-${{ github.ref_name }}-linux-x64.zip
      - name: Publish Release (Linux x64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-linux-x64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build (ARM64 via manylinux_2_28 with Auto-detected PySide6)
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -e GITHUB_REF_NAME=${{ github.ref_name }} \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            quay.io/pypa/manylinux_2_28_aarch64 bash -c '
              # 1. 安装基础依赖和系统级 Python 3.11
              yum install -y zip mesa-libGL libxkbcommon libxcb libX11 python3.11 python3.11-devel python3.11-pip && \
              
              # 2. 显式使用 /usr/bin/python3.11
              /usr/bin/python3.11 -m pip install --upgrade pip && \
              
              # 3. 让 pip 自动寻找兼容当前环境(glibc 2.28 aarch64)的 PySide6 版本
              /usr/bin/python3.11 -m pip install PySide6 shiboken6 && \
              /usr/bin/python3.11 -m pip install -r requirements.txt && \
              /usr/bin/python3.11 -m pip install pyinstaller && \
              
              # 4. 编译
              /usr/bin/python3.11 -m PyInstaller koi.spec && \
              
              # 5. 打包
              zip -r dist/wow-${GITHUB_REF_NAME}-linux-arm64.zip dist/*
            '
      - name: Upload build artifact (Linux ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-linux-arm64
          path: dist/wow-${{ github.ref_name }}-linux-arm64.zip
      - name: Publish Release (Linux ARM64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-linux-arm64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (macOS arm64)
        run: |
          pyinstaller koi.spec
      - name: Archive dist (macOS arm64)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist dist/wow-${{ github.ref_name }}-macos-arm64.zip
      - name: Upload build artifact (macOS arm64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-macos-arm64
          path: dist/wow-${{ github.ref_name }}-macos-arm64.zip
      - name: Publish Release (macOS arm64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-macos-arm64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-x64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (macOS x64)
        run: |
          pyinstaller koi.spec
      - name: Archive dist (macOS x64)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist dist/wow-${{ github.ref_name }}-macos-x64.zip
      - name: Upload build artifact (macOS x64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-macos-x64
          path: dist/wow-${{ github.ref_name }}-macos-x64.zip
      - name: Publish Release (macOS x64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-macos-x64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}