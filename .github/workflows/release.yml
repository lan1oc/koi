name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller koi.spec
      - name: Archive dist (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath dist/wow-${{ github.ref_name }}-windows.zip
      - name: Upload build artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-windows
          path: dist/wow-${{ github.ref_name }}-windows.zip
      - name: Publish Release (Windows)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-windows.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (x64 via Ubuntu 18.04 - glibc 2.27)
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            -e GITHUB_REF_NAME=${{ github.ref_name }} \
            -v "${{ github.workspace }}:/src" -w /src \
            ubuntu:18.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive && \
              apt-get update && \
              apt-get install -y software-properties-common && \
              add-apt-repository ppa:deadsnakes/ppa -y && \
              apt-get update && \
              apt-get install -y python3.9 python3.9-dev python3.9-distutils python3-pip \
                zip patchelf build-essential libgl1-mesa-dev libglib2.0-0 libdbus-1-3 \
                libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
                libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 && \
              curl -sS https://bootstrap.pypa.io/get-pip.py | python3.9 && \
              python3.9 -m pip install --upgrade pip setuptools wheel && \
              python3.9 -m pip install PySide6 shiboken6 && \
              python3.9 -m pip install -r /src/requirements.txt && \
              python3.9 -m pip install pyinstaller && \
              cd /src && \
              python3.9 -m PyInstaller koi.spec && \
              zip -r dist/wow-${GITHUB_REF_NAME}-linux-x64.zip dist/*
            '
      - name: Upload build artifact (Linux x64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-linux-x64
          path: dist/wow-${{ github.ref_name }}-linux-x64.zip
      - name: Publish Release (Linux x64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-linux-x64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build (ARM64 via Ubuntu 18.04 - glibc 2.27)
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -e GITHUB_REF_NAME=${{ github.ref_name }} \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            ubuntu:18.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive && \
              apt-get update && \
              apt-get install -y software-properties-common && \
              add-apt-repository ppa:deadsnakes/ppa -y && \
              apt-get update && \
              apt-get install -y python3.9 python3.9-dev python3.9-distutils python3-pip \
                zip patchelf build-essential libgl1-mesa-dev libglib2.0-0 libdbus-1-3 \
                libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
                libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 && \
              curl -sS https://bootstrap.pypa.io/get-pip.py | python3.9 && \
              python3.9 -m pip install --upgrade pip setuptools wheel && \
              python3.9 -m pip install PySide6 shiboken6 && \
              python3.9 -m pip install -r /src/requirements.txt && \
              python3.9 -m pip install pyinstaller && \
              cd /src && \
              python3.9 -m PyInstaller koi.spec && \
              zip -r dist/wow-${GITHUB_REF_NAME}-linux-arm64.zip dist/*
            '
      - name: Upload build artifact (Linux ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-linux-arm64
          path: dist/wow-${{ github.ref_name }}-linux-arm64.zip
      - name: Publish Release (Linux ARM64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-linux-arm64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (macOS arm64)
        run: |
          pyinstaller koi.spec
      - name: Archive dist (macOS arm64)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist dist/wow-${{ github.ref_name }}-macos-arm64.zip
      - name: Upload build artifact (macOS arm64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-macos-arm64
          path: dist/wow-${{ github.ref_name }}-macos-arm64.zip
      - name: Publish Release (macOS arm64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-macos-arm64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-x64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (macOS x64)
        run: |
          pyinstaller koi.spec
      - name: Archive dist (macOS x64)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist dist/wow-${{ github.ref_name }}-macos-x64.zip
      - name: Upload build artifact (macOS x64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-macos-x64
          path: dist/wow-${{ github.ref_name }}-macos-x64.zip
      - name: Publish Release (macOS x64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-macos-x64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}