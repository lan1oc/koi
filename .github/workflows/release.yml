name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v4.0.0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koi-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      KOI_EXPECTED_VERSION: '4.0.0'
      KOI_SOURCE_REVISION: ${{ github.sha }}
      KOI_RELEASE_STRICT: '1'
      CARGO_NET_OFFLINE: 'false'
      CARGO_NET_RETRY: '5'
      CARGO_HTTP_TIMEOUT: '120'
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}\.cargo-target-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read and validate app version
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content tauri-ui/src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^\"]+)"') {
            throw "Version not found in tauri-ui/src-tauri/Cargo.toml"
          }
          $version = $matches[1]
          if ($version -ne $env:KOI_EXPECTED_VERSION) {
            throw "Expected KOI $env:KOI_EXPECTED_VERSION, found $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Require clean committed release source
        shell: pwsh
        run: |
          $head = (git rev-parse --verify 'HEAD^{commit}').Trim().ToLowerInvariant()
          if ($head -notmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') { throw "Git returned an incomplete source revision: $head" }
          if ($head -ne $env:KOI_SOURCE_REVISION.ToLowerInvariant()) { throw "Checkout HEAD $head does not match workflow source $env:KOI_SOURCE_REVISION" }
          $changes = @(git status --porcelain=v1 --untracked-files=all)
          if ($changes.Count -gt 0) { throw "Release source tree is not clean:`n$($changes -join "`n")" }

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Verify Windows toolchain environment loading
        working-directory: tauri-ui
        shell: pwsh
        run: node --test --test-name-pattern='^Visual Studio environment ' scripts/release-workflow.test.mjs

      - name: Prepare Windows C++ tools and SDK
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $source = Join-Path $env:GITHUB_WORKSPACE 'build_release.ps1'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $names = @('Test-WindowsRustToolchain', 'Import-VisualStudioToolchain', 'Initialize-WindowsRustToolchain')
          $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -in $names }, $true) |
            ForEach-Object { Invoke-Expression $_.Extent.Text }
          # Hosted CI only uses its installed Microsoft tools or the signed
          # workload installer. Developer portable directories are not used.
          function Import-PortableWindowsRustToolchain { return $false }
          Initialize-WindowsRustToolchain -SkipInstall $false
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ($value) { "$name=$value" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          Get-Command link.exe, rc.exe | Select-Object Name, Source | Format-Table

      - name: Prepare locked runtime and tool dependencies
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tauri-ui/scripts/prepare-ci-dependencies.ps1') -CacheDirectory (Join-Path $env:RUNNER_TEMP 'koi-locked-downloads')
          node tauri-ui/scripts/verify-ci-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Prepared runtime dependencies did not pass provenance checks.' }

      - name: Install UI dependencies
        working-directory: tauri-ui
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            npm ci --prefer-offline --no-audit
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw 'Unable to install the locked UI dependencies.' }
            Start-Sleep -Seconds (2 * $attempt)
          }

      - name: Install Playwright Chromium
        working-directory: tauri-ui
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            npx --no-install playwright install chromium
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw 'Unable to download the locked Playwright browser.' }
            Start-Sleep -Seconds (2 * $attempt)
          }

      - name: Rust format gate
        working-directory: tauri-ui/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust check gate
        working-directory: tauri-ui/src-tauri
        run: cargo check --locked --all-targets

      - name: Rust clippy gate
        working-directory: tauri-ui/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust test gate
        working-directory: tauri-ui/src-tauri
        run: cargo test --locked --workspace --lib --tests -- --test-threads=1

      - name: Rust real AppContainer and supply-chain gates
        working-directory: tauri-ui/src-tauri
        shell: pwsh
        run: |
          $tests = @(
            'backend::external_tools::tests::official_release_archives_match_locked_product_inventories',
            'backend::probe_runner::tests::executes_in_the_real_locked_appcontainer_without_host_python',
            'backend::probe_runner::tests::agent_probe_reads_large_json_and_binary_and_preserves_script_errors',
            'backend::probe_runner::tests::expanded_probe_runs_multipart_auth_modules_format_and_tcp_with_real_timeout',
            'backend::probe_runner::tests::python_socket_maintains_a_multistep_protocol_connection',
            'backend::probe_runner::tests::tool_audit_python_can_retest_udp_protocol_and_preserve_binary_evidence',
            'backend::native_runtime::ai_retest::tests::tool_audit_http_and_python_share_authentication_and_context',
            'backend::native_runtime::ai_retest::tests::model_probe_error_is_repaired_and_both_scripts_survive_in_tool_events',
            'backend::probe_sandbox::tests::parallel_real_launches_keep_locked_runtime_acl_and_inputs_immutable',
            'backend::probe_source_builder::tests::builds_valid_wheel_in_networkless_four_process_sandbox',
            'backend::probe_source_builder::tests::rejects_source_archive_escape_before_backend_execution'
          )
          foreach ($test in $tests) {
            cargo test --locked --lib $test -- --ignored --exact --test-threads=1 --nocapture
            if ($LASTEXITCODE -ne 0) { throw "Required real security test failed: $test" }
          }

      - name: Verify backend contract
        working-directory: tauri-ui
        shell: pwsh
        run: npm run verify:backend-contract -- --strict-rust

      - name: Verify 97-command behavior matrix
        working-directory: tauri-ui
        run: npm run verify:behavior-matrix

      - name: Verify release gates and locked runtime provenance
        working-directory: tauri-ui
        run: npm run test:release-gates

      - name: Build frontend
        working-directory: tauri-ui
        run: npm run build

      - name: Run Playwright retest workflows
        working-directory: tauri-ui
        run: npm run test:e2e

      - name: Build Rust portable release
        working-directory: tauri-ui
        shell: pwsh
        run: |
          $env:KOI_RELEASE_BASE = Join-Path $env:GITHUB_WORKSPACE 'dist-tauri\4.0.0'
          $env:KOI_RELEASE_STRICT = '1'
          $env:KOI_EXPECTED_VERSION = '4.0.0'
          npm run release:portable

      - name: Run packaged Rust self-test
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'dist-tauri\4.0.0'
          $data = Join-Path $env:RUNNER_TEMP ("koi-self-test-" + [Guid]::NewGuid().ToString('N'))
          & (Join-Path $env:GITHUB_WORKSPACE 'tauri-ui/scripts/test-packaged-release.ps1') -Executable (Join-Path $base 'koi\koi.exe') -DataDirectory $data -ReportPath (Join-Path $env:RUNNER_TEMP 'koi-packaged-self-test.json')

      - name: Build per-user NSIS installer
        working-directory: tauri-ui
        shell: pwsh
        run: |
          $env:KOI_RELEASE_BASE = Join-Path $env:GITHUB_WORKSPACE 'dist-tauri\4.0.0'
          $env:KOI_RELEASE_STRICT = '1'
          $env:KOI_EXPECTED_VERSION = '4.0.0'
          npm run release:nsis

      - name: Test NSIS install update and uninstall
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'dist-tauri\4.0.0\koi-v4.0.0-windows-x64-setup.exe'
          & (Join-Path $env:GITHUB_WORKSPACE 'tauri-ui\scripts\test-nsis-lifecycle.ps1') -Installer $installer -ExpectedVersion '4.0.0'

      - name: Archive and checksum artifacts
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'dist-tauri\4.0.0'
          $version = '${{ steps.version.outputs.version }}'
          $portable = Join-Path $base "koi-v$version-windows-x64-portable.zip"
          $installer = Join-Path $base "koi-v$version-windows-x64-setup.exe"
          if (Test-Path $portable) { Remove-Item -LiteralPath $portable -Force }
          if (-not (Test-Path (Join-Path $base 'koi\koi.exe'))) { throw 'Rust executable is missing from portable tree' }
          if (-not (Test-Path $installer)) { throw "NSIS installer is missing: $installer" }
          # Keep user state out of the published archive. The build tree may
          # be reused by a runner, so stage only immutable seeds into the
          # distributable sibling koi-data directory.
          $stageRoot = Join-Path $env:RUNNER_TEMP ("koi-portable-data-" + [Guid]::NewGuid().ToString("N"))
          $stageData = Join-Path $stageRoot 'koi-data'
          New-Item -ItemType Directory -Force -Path $stageData | Out-Null
          try {
            foreach ($name in @('Report_Template', 'templates', 'enterprise_classification.db')) {
              $source = Join-Path (Join-Path $base 'koi') ("seed\{0}" -f $name)
              if (-not (Test-Path -LiteralPath $source)) { throw "Immutable release seed is missing: $source" }
              Copy-Item -LiteralPath $source -Destination (Join-Path $stageData $name) -Recurse -Force
            }
            Compress-Archive -Path @((Join-Path $base 'koi'), $stageData, (Join-Path $base 'release-manifest.json'), (Join-Path $base 'koi-portable.marker')) -DestinationPath $portable -CompressionLevel Optimal
          }
          finally {
            if (Test-Path -LiteralPath $stageRoot) { Remove-Item -LiteralPath $stageRoot -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($portable)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/').TrimStart('/') })
            foreach ($required in @('koi/koi.exe', 'koi-data/enterprise_classification.db')) {
              if ($entries -notcontains $required) { throw "Portable archive is missing required entry: $required" }
            }
            $forbidden = @($entries | Where-Object {
              $_ -match '(?i)(^|/)(config\.json|secrets\.dpapi\.json|\.env(?:\.local)?|cookies(?:\.sqlite)?|local state|login data|web data|\.koi_agent_sessions|\.retest-control|\.koi-runtime|\.koi_notice_process_state\.json|\.koi-notice-tasks\.json|\.koi-batch-tasks\.json|\.koi-native-runtime\.json|aiqicha_browser_profile|tyc_browser_profile|ebwebview|webview2(?:-data)?|logs)(/|$)' -or
              $_ -match '(?i)(^|/)(koi-backend[^/]*|[^/]*pyinstaller[^/]*|__pycache__|[^/]+\.(py|pyc|pyo|log))$'
            })
            if ($forbidden.Count -gt 0) { throw "Portable archive contains private or legacy backend entries: $($forbidden -join ', ')" }
          }
          finally { $zip.Dispose() }
          $env:KOI_REQUIRE_NSIS = '1'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tauri-ui')
          try {
            npm run finalize:release
            if ($LASTEXITCODE -ne 0) { throw 'Release finalization failed.' }
          } finally { Pop-Location }
          $env:KOI_REQUIRE_SUPPLY_CHAIN = '1'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tauri-ui')
          try {
            npm run verify:release
            if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
          } finally { Pop-Location }

      - name: Test final portable archive without system Python
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'dist-tauri\4.0.0'
          $extract = Join-Path $env:RUNNER_TEMP ("koi-portable-final-" + [Guid]::NewGuid().ToString('N'))
          $data = Join-Path $env:RUNNER_TEMP ("koi-portable-final-data-" + [Guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath (Join-Path $base 'koi-v4.0.0-windows-x64-portable.zip') -DestinationPath $extract
          & (Join-Path $env:GITHUB_WORKSPACE 'tauri-ui/scripts/test-packaged-release.ps1') -Executable (Join-Path $extract 'koi\koi.exe') -DataDirectory $data -ReportPath (Join-Path $env:RUNNER_TEMP 'koi-final-archive-self-test.json')

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: koi-v${{ steps.version.outputs.version }}-windows-x64
          if-no-files-found: error
          path: |
            dist-tauri/4.0.0/koi-v${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist-tauri/4.0.0/koi-v${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist-tauri/4.0.0/SHA256SUMS
            dist-tauri/4.0.0/supply-chain.json

      - name: Verify tag still references the built source
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "refs/tags/v${{ steps.version.outputs.version }}"
          $refs = @(git ls-remote --exit-code origin $tag "$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release tag before publication.' }
          $direct = $null
          $peeled = $null
          foreach ($line in $refs) {
            $fields = "$line" -split '\s+', 2
            if ($fields[1] -eq "$tag^{}") { $peeled = $fields[0] }
            elseif ($fields[1] -eq $tag) { $direct = $fields[0] }
          }
          $current = if ($peeled) { $peeled } else { $direct }
          if ($current -ne $env:KOI_SOURCE_REVISION) { throw 'A newer hotfix moved this tag. This older build must not publish its artifacts.' }

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-tauri/4.0.0/koi-v${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist-tauri/4.0.0/koi-v${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist-tauri/4.0.0/SHA256SUMS
            dist-tauri/4.0.0/supply-chain.json
          tag_name: v${{ steps.version.outputs.version }}
          name: Koi v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: koi-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            output/playwright/
            ${{ runner.temp }}/koi-*-self-test.json*
