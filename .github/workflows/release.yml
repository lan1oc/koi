name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $py = @'
          import os,json,re,pathlib
          def read_config_version():
              p=pathlib.Path("config.json")
              if p.exists():
                  try:
                      data=json.loads(p.read_text(encoding="utf-8"))
                      v=data.get("app",{}).get("version")
                      if v:
                          return v
                  except Exception:
                      pass
              try:
                  text=pathlib.Path("modules/config/config_manager.py").read_text(encoding="utf-8")
                  m=re.search(r"'version'\s*:\s*'([^']+)'", text)
                  if m:
                      return m.group(1)
              except Exception:
                  pass
              return "0.0.0"
          ref=os.getenv("GITHUB_REF_NAME","")
          if ref.startswith("v") and re.match(r"^v\d+\.\d+\.\d+", ref):
              v=ref[1:]
          else:
              v=read_config_version()
          print(v)
          '@
          $version = python -c $py
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller koi.spec
      - name: Archive dist (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath dist/wow-v${{ steps.version.outputs.version }}-windows.zip
      - name: Upload build artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: wow-v${{ steps.version.outputs.version }}-windows
          path: dist/wow-v${{ steps.version.outputs.version }}-windows.zip
      - name: Publish Release (Windows)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-v${{ steps.version.outputs.version }}-windows.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
