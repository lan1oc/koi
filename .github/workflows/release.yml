name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller koi.spec
      - name: Archive dist (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath dist/wow-${{ github.ref_name }}-windows.zip
      - name: Upload build artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-windows
          path: dist/wow-${{ github.ref_name }}-windows.zip
      - name: Publish Release (Windows)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-windows.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglib2.0-0 libdbus-1-3 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 \
            libxkbcommon0 libxcb-cursor0 fuse libfuse2 file
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller
        run: |
          pyinstaller koi.spec
      
      - name: Download and setup AppImageTool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
      
      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy the PyInstaller output
          cp -r dist/koi/* AppDir/usr/bin/
          
          # Create desktop entry
          cat > AppDir/usr/share/applications/wow.desktop << 'EOF'
          [Desktop Entry]
          Name=Wow Data Processor
          Exec=koi
          Icon=wow
          Type=Application
          Categories=Utility;
          EOF
          
          # Create a simple icon (you can replace this with your actual icon)
          cat > AppDir/usr/share/icons/hicolor/256x256/apps/wow.png << 'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
          EOF
          
          # Create AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/koi" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Create symlinks for AppImage
          ln -sf usr/share/applications/wow.desktop AppDir/wow.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/wow.png AppDir/wow.png
      
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir wow-${{ github.ref_name }}-linux-x64.AppImage
          chmod +x wow-${{ github.ref_name }}-linux-x64.AppImage
      
      - name: Upload build artifact (Linux x64 AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-linux-x64
          path: wow-${{ github.ref_name }}-linux-x64.AppImage
      
      - name: Publish Release (Linux x64 AppImage)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wow-${{ github.ref_name }}-linux-x64.AppImage
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build ARM64 in Docker
        run: |
          docker run --rm --platform linux/arm64 \
            -e GITHUB_REF_NAME=${{ github.ref_name }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:20.04 bash -c '
              export DEBIAN_FRONTEND=noninteractive && \
              apt-get update && \
              apt-get install -y python3.9 python3-pip python3.9-dev build-essential \
                libgl1-mesa-dev libglib2.0-0 libdbus-1-3 \
                libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
                libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
                libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 \
                libxkbcommon0 libxcb-cursor0 wget file && \
              python3.9 -m pip install --upgrade pip setuptools wheel && \
              python3.9 -m pip install -r requirements.txt && \
              python3.9 -m pip install pyinstaller && \
              python3.9 -m PyInstaller koi.spec && \
              wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage -O appimagetool && \
              chmod +x appimagetool && \
              mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps && \
              cp -r dist/koi/* AppDir/usr/bin/ && \
              cat > AppDir/usr/share/applications/wow.desktop << "EOFDESKTOP"
          [Desktop Entry]
          Name=Wow Data Processor
          Exec=koi
          Icon=wow
          Type=Application
          Categories=Utility;
          EOFDESKTOP
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > AppDir/usr/share/icons/hicolor/256x256/apps/wow.png && \
              cat > AppDir/AppRun << "EOFRUN"
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/koi" "$@"
          EOFRUN
              chmod +x AppDir/AppRun && \
              ln -sf usr/share/applications/wow.desktop AppDir/wow.desktop && \
              ln -sf usr/share/icons/hicolor/256x256/apps/wow.png AppDir/wow.png && \
              ARCH=aarch64 ./appimagetool AppDir wow-${GITHUB_REF_NAME}-linux-arm64.AppImage && \
              chmod +x wow-${GITHUB_REF_NAME}-linux-arm64.AppImage
            '
      
      - name: Upload build artifact (Linux ARM64 AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-linux-arm64
          path: wow-${{ github.ref_name }}-linux-arm64.AppImage
      
      - name: Publish Release (Linux ARM64 AppImage)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wow-${{ github.ref_name }}-linux-arm64.AppImage
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (macOS arm64)
        run: |
          pyinstaller koi.spec
      - name: Archive dist (macOS arm64)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist dist/wow-${{ github.ref_name }}-macos-arm64.zip
      - name: Upload build artifact (macOS arm64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-macos-arm64
          path: dist/wow-${{ github.ref_name }}-macos-arm64.zip
      - name: Publish Release (macOS arm64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-macos-arm64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-x64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (macOS x64)
        run: |
          pyinstaller koi.spec
      - name: Archive dist (macOS x64)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist dist/wow-${{ github.ref_name }}-macos-x64.zip
      - name: Upload build artifact (macOS x64)
        uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-macos-x64
          path: dist/wow-${{ github.ref_name }}-macos-x64.zip
      - name: Publish Release (macOS x64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}-macos-x64.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}