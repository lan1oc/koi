name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller koi.spec
      - name: Archive dist
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath dist/wow-${{ github.ref_name }}.zip
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/wow-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}